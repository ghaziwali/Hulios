[workspace]
resolver = "2"
members = [
    "hulios",
    "hulios-ebpf",
    "hulios-tun",
    "hulios-dns",
    "hulios-onionmasq",
    "hulios-state",
    "hulios-netcompat",
    "hulios-cli",
    "hulios-common",
]
default-members = [
    "hulios",
    "hulios-tun",
    "hulios-dns",
    "hulios-onionmasq",
    "hulios-state",
    "hulios-netcompat",
    "hulios-cli",
    "hulios-common",
]

[workspace.package]
version = "2.0.0-rc.1"
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]
aya = { version = "0.13", default-features = false, features = ["async_tokio"] }
aya-log = "0.2"
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
arti-client = { version = "0.42", default-features = false, features = ["flowctl-cc", "tokio", "native-tls", "experimental-api", "geoip"] }
tor-rtcompat = { version = "0.42", default-features = false, features = ["tokio"] }
tor-config = "0.42"
tun = { version = "0.6", default-features = false, features = ["async"] }
onionmasq = { git = "https://gitlab.torproject.org/tpo/core/onionmasq", package = "onion-tunnel", rev = "73afb3189ac11c6532a2bf647a2cb41a2d2e16ea" }
tokio = { version = "1", default-features = false, features = ["full"] }
hickory-server = { version = "0.26.1" }
hickory-resolver = "0.26.1"
hickory-proto = "0.26.1"
rtnetlink = "0.14"
netlink-packet-route = "0.21"
sysctl = "0.5"
seccompiler = "0.4"
clap = { version = "4", default-features = false, features = ["derive", "env", "std", "help"] }
toml = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1.0"
zbus = { version = "4", default-features = false, features = ["tokio"] }
caps = "0.5"
nix = { version = "0.29", default-features = false, features = ["user", "process", "fs", "net", "signal", "term"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = "0.4"
once_cell = "1"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
sd-notify = "0.4"

# Workspace local dependencies
hulios-ebpf = { path = "hulios-ebpf", version = "2.0.0-rc.1" }
hulios-common = { path = "hulios-common", version = "2.0.0-rc.1" }
hulios-tun = { path = "hulios-tun", version = "2.0.0-rc.1" }
hulios-dns = { path = "hulios-dns", version = "2.0.0-rc.1" }
hulios-onionmasq = { path = "hulios-onionmasq", version = "2.0.0-rc.1" }
hulios-state = { path = "hulios-state", version = "2.0.0-rc.1" }
hulios-netcompat = { path = "hulios-netcompat", version = "2.0.0-rc.1" }
hulios-cli = { path = "hulios-cli", version = "2.0.0-rc.1" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

